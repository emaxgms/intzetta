    <!-- Il CSS di Leaflet è già dentro il bundle applicativo: non serve ricaricarlo da unpkg. -->

      rel="stylesheet"
    />
    <!-- Le tessere della mappa servono solo quando si gioca: preconnect per ridurre l'attesa al primo round. -->
    <link rel="preconnect" href="https://server.arcgisonline.com" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Intzetta",
        "url": "https://intzetta.top/",
        "applicationCategory": "GameApplication",
        "genre": "Quiz di geografia",

  <body>
    <div id="root"></div>
    <noscript>
      <h1>Intzetta — il gioco dei paesi della Sardegna</h1>
      <p>
        Intzetta è un gioco di geografia: ti viene mostrato il nome di un paese sardo e devi individuarlo
        sulla mappa. Il punteggio dipende da quanto sei vicino: 8 round, 377 comuni, fino a 40.000 punti.
        Per giocare serve JavaScript attivo.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
